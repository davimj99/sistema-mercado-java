name: Release-v1.3.0

on:
  push:
    branches:
      - main
      - "release/**"
      - "feature/**"

  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  build:
    name: Build Projeto Java
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"

      - name: Verificar versão do Java
        run: |
          java -version
          javac -version

      - name: Criar diretório de saída
        run: mkdir -p out

      - name: Localizar arquivos Java
        run: find src -name "*.java" > sources.txt

      - name: Compilar projeto
        run: javac -encoding UTF-8 -d out @sources.txt

      - name: Verificar arquivos compilados
        run: |
          echo "Arquivos compilados:"
          find out -type f

      - name: Upload dos arquivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: mercado-java-v1.3.0
          path: out/